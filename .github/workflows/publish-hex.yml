name: Publish Elixir to Hex

on:
  push:
    tags:
      # Final releases only. Keep this aligned with publish-python.yml.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final release tag to publish, such as v0.4.4
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish client_signals to Hex
    runs-on: ubuntu-latest
    environment: hex
    defaults:
      run:
        working-directory: elixir
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a final release tag like v0.4.4"
            exit 1
          fi

      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'

      - name: Stamp version from tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Strip the leading v; mix.exs ships a 0.0.0 placeholder.
          VERSION="${RELEASE_TAG#v}"
          echo "Publishing client_signals ${VERSION}"
          sed -i "s/version: \".*\"/version: \"${VERSION}\"/" mix.exs

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests and formatting checks
        run: |
          mix test
          mix format --check-formatted

      - name: Build documentation and package
        run: |
          mix docs
          mix hex.build

      - name: Publish package and documentation to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
